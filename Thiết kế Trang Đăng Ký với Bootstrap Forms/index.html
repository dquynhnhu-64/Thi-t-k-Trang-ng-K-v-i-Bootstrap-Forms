<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - Bootstrap Forms</title>
    <!-- Nhúng CSS của Bootstrap 5 từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Thẻ Card chứa Form đăng ký -->
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Tiêu đề & Tiêu đề phụ (Bootstrap Text Elements) -->
                        <h2 class="text-center text-primary fw-bold mb-2">Đăng Ký Tài Khoản</h2>
                        <p class="text-center text-muted mb-4 fs-6">Vui lòng điền đầy đủ thông tin bên dưới để tạo tài khoản mới.</p>

                        <form action="#" method="POST">
                            
                            <!-- 1. Họ và tên -->
                            <div class="mb-3">
                                <label for="fullname" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullname" placeholder="Nguyễn Văn A" required>
                            </div>

                            <!-- 2. Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                <div class="form-text text-muted">Chúng tôi sẽ không bao giờ chia sẻ email của bạn với bất kỳ ai khác.</div>
                            </div>

                            <!-- 3. Mật khẩu & 4. Xác nhận mật khẩu (Chia 2 cột trên màn hình lớn) -->
                            <div class="row g-3 mb-3">
                                <div class="col-12 col-sm-6">
                                    <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                                </div>
                                <div class="col-12 col-sm-6">
                                    <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="••••••••" required>
                                </div>
                            </div>

                            <!-- 5. Giới tính (Radio buttons) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                                    <label class="form-check-label" for="genderMale">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                                    <label class="form-check-label" for="genderFemale">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                                    <label class="form-check-label" for="genderOther">Khác</label>
                                </div>
                            </div>

                            <!-- 6. Sở thích (Checkboxes) -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold d-block">Sở thích</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding">
                                    <label class="form-check-label" for="hobbyCoding">Lập trình</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                                    <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="hobbySports" value="sports">
                                    <label class="form-check-label" for="hobbySports">Thể thao</label>
                                </div>
                            </div>

                            <!-- 7. Quốc gia (Dropdown Select) -->
                            <div class="mb-4">
                                <label for="country" class="form-label fw-semibold">Quốc gia</label>
                                <select class="form-select" id="country">
                                    <option value="" selected disabled>-- Chọn quốc gia --</option>
                                    <option value="vn">Việt Nam</option>
                                    <option value="us">Mỹ (United States)</option>
                                    <option value="jp">Nhật Bản (Japan)</option>
                                    <option value="kr">Hàn Quốc (Korea)</option>
                                </select>
                            </div>

                            <!-- 8. Nút Submit (Bootstrap Button) -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">Đăng Ký ngay</button>
                            </div>

                        </form>

                    </div>
                </div>

                <!-- Footer liên kết nhỏ phía dưới -->
                <p class="text-center text-muted mt-3 fs-6">
                    Đã có tài khoản? <a href="#" class="text-primary text-decoration-none fw-semibold">Đăng nhập</a>
                </p>

            </div>
        </div>
    </div>

    <!-- Nhúng JavaScript của Bootstrap 5 từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
